name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python and JS test suites
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          for test in tests/*.cjs; do node "$test" || exit 1; done
          test -f tests/desktop-app.cjs

      - name: Package Chrome MV3 extension
        run: ./bin/package-extension.sh

      - name: Package server release bundle
        run: |
          mkdir -p release-bundle/desktop release-bundle/bin
          cp sync_server.py roku_client.py roku_dashboard.py local_env.py aec_daemon.py dashboard.html README.md ARCHITECTURE.md PRIVACY.md release-bundle/
          cp .env.example release-bundle/
          cp dist/roku-netflix-sync-extension.zip release-bundle/
          cp desktop/package.json desktop/main.js desktop/preload.js desktop/controller.cjs desktop/local-env.cjs \
             desktop/server.cjs desktop/index.html desktop/renderer.js desktop/styles.css release-bundle/desktop/
          cp bin/package-extension.sh bin/launch-desktop.sh bin/render-privacy.py release-bundle/bin/
          chmod +x release-bundle/bin/*.sh
          tar czf build.tar.gz -C release-bundle .
          tar tzf build.tar.gz | grep -qx './aec_daemon.py' || { echo 'aec_daemon.py missing from build.tar.gz' >&2; exit 1; }
          tar tzf build.tar.gz | grep -qx './desktop/controller.cjs' || { echo 'desktop/controller.cjs missing from build.tar.gz' >&2; exit 1; }
          tar tzf build.tar.gz | grep -qx './bin/launch-desktop.sh' || { echo 'bin/launch-desktop.sh missing from build.tar.gz' >&2; exit 1; }

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(git rev-parse --short HEAD)
            echo "tag_name=v0.3.${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: |
            build.tar.gz
            dist/roku-netflix-sync-extension.zip
          generate_release_notes: true
