name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python and JS test suites
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          for test in tests/*.cjs; do node "$test" || exit 1; done

      - name: Package Chrome MV3 extension
        run: ./bin/package-extension.sh

      - name: Package server release bundle
        run: |
          mkdir -p release-bundle
          cp sync_server.py roku_client.py roku_dashboard.py dashboard.html README.md ARCHITECTURE.md release-bundle/
          cp dist/roku-netflix-sync-extension.zip release-bundle/
          tar czf build.tar.gz -C release-bundle .

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(git rev-parse --short HEAD)
            echo "tag_name=v0.3.${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: |
            build.tar.gz
            dist/roku-netflix-sync-extension.zip
          generate_release_notes: true
